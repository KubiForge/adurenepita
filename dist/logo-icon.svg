<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F1DFA5" stop-opacity="1" />
      <stop offset="60%" stop-color="#D8BE82" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8F7952" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="charcoalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242426" />
      <stop offset="100%" stop-color="#101113" />
    </linearGradient>
    <linearGradient id="goldLinear" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8F7952" />
      <stop offset="50%" stop-color="#D8BE82" />
      <stop offset="100%" stop-color="#F1DFA5" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#charcoalGrad)" stroke="#D8BE82" stroke-width="1.5" />
  <!-- Dark silhouette side (left) -->
  <path d="M50 8 A42 42 0 0 0 50 92 Z" fill="#101113" />
  <!-- Golden Moon / Sun on right (Light emergence) -->
  <circle cx="62" cy="42" r="18" fill="url(#goldGlow)" />
  <circle cx="62" cy="42" r="14" fill="#F1DFA5" opacity="0.9" />
  <!-- Ascending Hope Path -->
  <path d="M46 88 C48 70, 56 60, 62 48 C64 54, 58 72, 54 88 Z" fill="url(#goldLinear)" />
  <!-- Sprout of Life / Hope -->
  <path d="M62 48 C64 42, 70 41, 72 44 C69 47, 65 47, 62 48 Z" fill="#D8BE82" />
  <path d="M62 48 C59 44, 59 40, 61 38 C63 42, 62 45, 62 48 Z" fill="#F1DFA5" />
  <!-- Subtle Stars / Birds -->
  <path d="M74 32 Q76 30 78 32 Q80 30 82 32 Q78 34 74 32 Z" fill="#D8BE82" opacity="0.8" />
  <path d="M78 26 Q80 24 81 26 Q83 24 84 26 Q81 27 78 26 Z" fill="#F1DFA5" opacity="0.7" />
</svg>
